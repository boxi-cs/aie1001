  <meta name="description" content="AIE1001 Introduction to AI Programming (CUHK-Shenzhen), Lecture 5: interactive notes on lists, dictionaries and tuples. Step through names and objects, list methods, counting with a dictionary and sorting by value.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F6E73'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='15' font-weight='700' text-anchor='middle' fill='%23F6F5F1'%3E[ ]%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    /* Lecture 5 widgets: names → objects diagrams, dictionaries, chips. */
    .l5-view { background: var(--paper-2); border-radius: 10px; padding: 10px; min-width: 0; overflow-x: auto; }
    .l5-view > small { display: block; font: 500 11px var(--mono); color: var(--stone); margin-bottom: 6px; }
    .memsvg { max-width: 100%; height: auto; }
    .l5-player.mini { grid-template-columns: minmax(0, 1fr); }
    .l5-cells { justify-content: flex-start; }
    .l5-cell { width: auto; min-width: 38px; padding: 0 8px; font-size: 13px; }
    .l5-lab { font: 500 11px var(--mono); color: var(--stone); margin: 10px 0 2px; }
    .l5-lab:first-child { margin-top: 0; }
    .l5-str { font: 13px var(--mono); background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; overflow-wrap: anywhere; }
    .l5-dict { display: grid; gap: 3px; }
    .l5-row { display: grid; grid-template-columns: minmax(70px, auto) 1fr; gap: 3px; font: 13px var(--mono); }
    .l5-row > span { border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; background: var(--card); position: relative; overflow: hidden; }
    .l5-row .k { background: var(--card-2); }
    .l5-row .v b { position: relative; font-weight: 600; }
    .l5-row.hot > span { border-color: var(--amber); }
    .l5-row.hot .v { background: var(--mark); }
    .l5-bar { position: absolute; left: 0; top: 0; bottom: 0; background: var(--teal-soft); }
    .l5-empty { font: 13px var(--mono); color: var(--stone); border: 1px dashed var(--line); border-radius: 6px; padding: 4px 8px; }
    .l5-chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .l5-chips .tag { border: 1px solid transparent; }
    .l5-chips .tag.on { background: var(--mark); border-color: var(--amber); color: var(--ink); }
    .l5-chips .tag.past { opacity: 0.5; }
    .l5-chips .tag.top { background: var(--green-soft); border-color: var(--green); color: var(--green); }
    .l5-lines { font: 13px/1.7 var(--mono); }
    .l5-lines span.on { background: var(--mark); box-shadow: 0 0 0 1px var(--amber); border-radius: 3px; }
    .l5-op { padding-left: 18px; font: 600 18px var(--mono); color: var(--amber); }
    .l5-dv .console { max-height: 240px; }
  </style>
</head>
